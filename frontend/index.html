<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>University course Portal</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <section class="container">
      <!-- header section -->
      <header>
        <h1>Course Management System</h1>
        <p>Full CRUD Operations with REST API</p>
        <div class="API__status">
          <strong
            >API Base URL: <span id="baseUrl">http://localhost:1616</span>|
            <strong>Status:</strong
            ><span id="apiStatus">Not Connected</span></strong
          >
        </div>
      </header>

      <!-- operation section -->
      <div class="operation__div">
        <div id="statusMessage" class="status"></div>
        <form action="">
          <label for="code">Course Code</label>
          <input
            type="text"
            placeholder="e.g, CS101 or DS103"
            id="courseCode"
          />
          <label for="name">Course Name</label>
          <input
            type="text"
            placeholder="Cybersecurity or Data Science"
            id="courseName"
          />
        </form>
        <div class="api__buttons">
          <button class="all__btn" onclick="getAllCourses()">All Courses</button
          ><button class="one__btn" onclick="getOneCourse()">One Course</button
          ><button class="add__btn" onclick="addCourse()">Add Course</button>
          <button class="update__btn" onclick="updateCourse()">
            Update Course
          </button>
        </div>

        <form action="" onclick="updateBaseUrl(event)">
          <label for="apiBaseUrl">API Base URL</label>
          <input
            type="text"
            id="apiBaseUrl"
            placeholder="http://localhost:1616"
          />
          <button class="baseUrl__update__btn">Update Base URL</button>
        </form>
      </div>
      <!-- course list div -->
      <div class="course__list__div">
        <div class="course__list__div__header">
          <h2>Courses List</h2>
          <button onclick="getAllCourses()">Refresh</button>
        </div>
        <div class="fetch__data__header">
          <div>Course ID</div>
          <div>Course Code</div>
          <div>Course Name</div>
          <div class="edit__delete__header">
            <div>Edit</div>
            <div>Delete</div>
          </div>
        </div>
        <div id="apiFetchDataContainer" style="display: none">
          <!-- here is course lists -->
        </div>
      </div>

      <!-- data section -->
      <div class="data__section">
        <h4>Course Management System Frontend</h4>
        <button id="currentApiUrl">Connected to: http://localhost:1616</button>
        <h4>Built with HTML, CSS and Vanilla JavaScript</h4>
      </div>
    </section>
    <script src="main.js"></script>
  </body>
</html>
